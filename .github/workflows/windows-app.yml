name: windows-app

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "rust/**"
      - "protocol/desktop-v1.md"
      - ".github/workflows/windows-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "rust/**"
      - "protocol/desktop-v1.md"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
            rust/target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Frontend checks
        working-directory: windows
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm run test
          npm run build

      - name: Build installer
        shell: powershell
        # Real helper only: the script fails closed if rust/ stops compiling
        # on Windows. Preview builds need an explicit -FakeHelper and are
        # never produced by CI.
        run: |
          windows\scripts\build-installer.ps1 -SkipNpm

      - name: Backend tests
        working-directory: windows/src-tauri
        run: cargo test

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: acs-windows-installer
          path: |
            windows/src-tauri/target/release/bundle/nsis/*-setup.exe
            windows/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
