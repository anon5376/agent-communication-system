name: aos binaries

# Builds the aos command for Linux and macOS, so install.sh can download it
# instead of building from source. On pull requests that touch the Rust code
# it only builds and smoke-tests. Pushing a tag that starts with aos-v (for
# example aos-v0.1.0) also publishes the builds as a GitHub release.

on:
  pull_request:
    paths:
      - "rust/**"
      - "install.sh"
      - ".github/workflows/aos-binaries.yml"
  push:
    tags:
      - "aos-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true, run: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true, run: true }
          - { os: macos-14, target: aarch64-apple-darwin, run: true }
          - { os: macos-14, target: x86_64-apple-darwin, run: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin aos --target ${{ matrix.target }} --manifest-path rust/Cargo.toml
      - name: Smoke test
        if: matrix.run
        run: |
          bin=rust/target/${{ matrix.target }}/release/aos
          $bin --version
          $bin --help | head -n 3
          HOME="$(mktemp -d)" $bin demo --print 80x24 swarm | head -n 4
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/aos-${{ matrix.target }}.tar.gz -C rust/target/${{ matrix.target }}/release aos
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum aos-${{ matrix.target }}.tar.gz > aos-${{ matrix.target }}.tar.gz.sha256
          else shasum -a 256 aos-${{ matrix.target }}.tar.gz > aos-${{ matrix.target }}.tar.gz.sha256; fi
      - uses: actions/upload-artifact@v4
        with:
          name: aos-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/aos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "aos ${GITHUB_REF_NAME#aos-v}" \
            --notes "Install: curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/rust-port/install.sh | sh"
