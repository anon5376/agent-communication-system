[package]
name = "acs"
version = "0.1.0"
edition = "2021"
description = "Rust port of the agent-communication-system bus and CLI (qagent)"
license = "MIT"
autobins = false

[lib]
name = "acs"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
dirs = "5"
notify = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
ureq = { version = "3.4", features = ["json"] }

ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
proptest = "=1.6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[[bin]]
name = "qagent"
path = "src/bin/qagent.rs"

[[bin]]
name = "agent-bus"
path = "src/bin/agent_bus.rs"

[[bin]]
name = "qagent-openai-compatible"
path = "src/bin/openai_compatible.rs"

[[bin]]
name = "agent-bus-openai-compatible"
path = "src/bin/agent_bus_openai_compatible.rs"

[[bin]]
name = "acs-app"
path = "src/bin/app.rs"

[[bin]]
name = "acs"
path = "src/bin/acs.rs"

[[bin]]
name = "aos"
path = "src/bin/aos.rs"

[[bin]]
name = "acs-desktop"
path = "src/bin/desktop.rs"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
